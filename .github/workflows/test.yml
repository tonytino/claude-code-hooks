name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq -e . >/dev/null
      - name: Lint shell
        run: shellcheck block-self-bind-schedule/hooks/*.sh test/*.sh
      - name: Run tests
        run: test/run.sh
